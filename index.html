<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyrule Field Dynamic Audio Sequencer</title>

    <script type="importmap">
    {
      "imports": {
        "tone": "https://esm.sh/tone@15.1.22"
      }
    }
    </script>
  <script type="module" crossorigin src="./assets/index-D3yMOdEt.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DROzcXZI.css">
</head>
<body>
    <main class="nintendo-console">
        <!-- Play Button Overlay on Load -->
        <div id="play-overlay" class="play-overlay">
            <button id="start-btn" class="start-btn" disabled>
                <div class="start-btn-inner">
                    <span class="start-triforce">▲</span>
                    <span id="start-btn-label" class="start-btn-text">LOADING SAMPLES...</span>
                </div>
                <span class="start-subtext">TAP TO ENTER HYRULE</span>
            </button>
        </div>

        <!-- Top Nintendo Bar -->
        <header class="console-header">
            <div class="brand-badge">
                <span class="triforce">▲</span>
                <span class="brand-text">HYRULE FIELD</span>
            </div>
            <div id="loading-indicator" class="status-pill loading">⏳ Loading...</div>
        </header>

        <!-- Compact Nintendo HUD Strip -->
        <section class="hud-bar">
            <div class="hud-col active-col">
                <span class="hud-tag">NOW</span>
                <span id="cue-display" class="hud-title mode-exploration">☀️ Sunrise (Bars 1–9)</span>
            </div>
            <div class="hud-col clock-col">
                <span id="cue-measure-counter" class="hud-clock">Bar 1/8</span>
            </div>
            <div class="hud-col next-col">
                <span id="hud-next-tag" class="hud-tag muted">NEXT</span>
                <span id="cue-next-display" class="hud-title next-title">Intro Fanfare</span>
            </div>
        </section>

        <!-- Fixed-Height Motif & Status Subline (Zero Layout Shift) -->
        <div class="hud-subbar">
            <span id="cue-subname" class="hud-subtext">Morning Dawn Ocarina</span>
            <span id="cue-pending-text" class="hud-pending-text" style="display: none;">• ⏳ Queued for Bar 8 Downbeat</span>
        </div>

        <!-- Right-to-Left Streaming Canvas Visualizer -->
        <div class="viewport-canvas">
            <canvas id="note-stream-canvas" width="600" height="175"></canvas>
            <div class="viewport-legend">
                <span class="dot green"></span><span>Day</span>
                <span class="dot blue"></span><span>Night</span>
                <span class="dot red"></span><span>Battle</span>
            </div>
        </div>

        <!-- Nintendo 3-Button Control Pad (Thumb-friendly horizontal row) -->
        <nav class="controller-pad">
            <button class="pad-btn day-btn active" data-mode="EXPLORATION" disabled>
                <span class="pad-icon">☀️</span>
                <span class="pad-label">Day</span>
            </button>
            <button class="pad-btn night-btn" data-mode="QUIET" disabled>
                <span class="pad-icon">🌙</span>
                <span class="pad-label">Night</span>
            </button>
            <button class="pad-btn battle-btn" data-mode="BATTLE" disabled>
                <span class="pad-icon">⚔️</span>
                <span class="pad-label">Battle</span>
            </button>
        </nav>
    </main>

</body>
</html>
