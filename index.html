<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyrule Field Dynamic Audio Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "tone": "https://esm.sh/tone@15.1.22"
      }
    }
    </script>
</head>
<body>
    <main class="nintendo-console">
        <!-- Top Nintendo Bar -->
        <header class="console-header">
            <div class="brand-badge">
                <span class="triforce">▲</span>
                <span class="brand-text">HYRULE FIELD</span>
            </div>
            <div id="loading-indicator" class="status-pill loading">⏳ Loading...</div>
        </header>

        <!-- Compact Nintendo HUD Strip -->
        <section class="hud-bar">
            <div class="hud-col active-col">
                <span class="hud-tag">NOW</span>
                <span id="cue-display" class="hud-title mode-exploration">☀️ Day 1 (Bars 17–25)</span>
            </div>
            <div class="hud-col clock-col">
                <span id="cue-measure-counter" class="hud-clock">Bar 1/8</span>
            </div>
            <div class="hud-col next-col">
                <span class="hud-tag muted">NEXT</span>
                <span id="cue-next-display" class="hud-title next-title">☀️ Day 2</span>
            </div>
        </section>

        <!-- Transition Queue Pill (Appears when state change is queued) -->
        <div id="cue-pending-badge" class="transition-pill" style="display: none;">
            ⏳ Switching at next 8-bar downbeat
        </div>

        <!-- Right-to-Left Streaming Canvas Visualizer -->
        <div class="viewport-canvas">
            <canvas id="note-stream-canvas" width="600" height="175"></canvas>
            <div class="viewport-legend">
                <span class="dot green"></span><span>Day</span>
                <span class="dot blue"></span><span>Night</span>
                <span class="dot red"></span><span>Battle</span>
            </div>
        </div>

        <!-- Nintendo 3-Button Control Pad (Touch-friendly horizontal row) -->
        <nav class="controller-pad">
            <button class="pad-btn day-btn active" data-mode="EXPLORATION">
                <span class="pad-icon">☀️</span>
                <span class="pad-label">Day</span>
            </button>
            <button class="pad-btn night-btn" data-mode="QUIET">
                <span class="pad-icon">🌙</span>
                <span class="pad-label">Night</span>
            </button>
            <button class="pad-btn battle-btn" data-mode="BATTLE">
                <span class="pad-icon">⚔️</span>
                <span class="pad-label">Battle</span>
            </button>
        </nav>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
